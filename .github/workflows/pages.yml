# Builds the unified site and deploys it with Storybook under /storybook.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Let the deploy step mint the Pages token; allow one deploy at a time.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build the unified site
        run: npm run site:build
      - name: Build Storybook
        run: npm run build-storybook
      - name: Assemble the site (unified site /, Storybook /storybook)
        run: |
          rm -rf _site
          mkdir -p _site/storybook
          cp -r examples/dist/. _site/
          cp -r storybook-static/. _site/storybook/
          cp llms.txt _site/llms.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
