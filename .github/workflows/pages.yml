# Builds the live playground and deploys it to GitHub Pages:
#   the examples gallery at the site root, Storybook under /storybook.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Let the deploy step mint the Pages token; allow one deploy at a time.
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Build the examples gallery
        run: npm run examples:build
      - name: Build Storybook
        run: npm run build-storybook
      - name: Build the docs
        run: npm run docs:build
      - name: Assemble the site (gallery /, Storybook /storybook, docs /docs)
        run: |
          rm -rf _site
          mkdir -p _site/storybook _site/docs
          cp -r examples/dist/. _site/
          cp -r storybook-static/. _site/storybook/
          cp -r docs-site/. _site/docs/
          cp llms.txt _site/llms.txt
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
